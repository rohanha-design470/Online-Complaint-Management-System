<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Track Complaints</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>ResolveIT</b><span><a href="/">Submit</a> <a href="/track">Track</a> <a href="/admin">Admin</a></span></nav><main class="card wide"><h1>Track your complaints</h1><form action="/track" method="post"><label>Email address</label><input name="email" type="email" placeholder="Email used when submitting" required><button type="submit">Find Complaints</button></form><section th:if="${complaints != null}"><h2 th:text="|Results for ${email}|"></h2><p th:if="${complaints.isEmpty()}">No complaints found for this email.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Subject</th><th>Category</th><th>Status</th><th>Submitted</th></tr></thead><tbody><tr th:each="c:${complaints}"><td th:text="${c.id}"></td><td th:text="${c.subject}"></td><td th:text="${c.category}"></td><td><span class="badge" th:text="${c.status}"></span></td><td th:text="${#temporals.format(c.createdAt,'dd MMM yyyy HH:mm')}"></td></tr></tbody></table></div></section></main></body></html>
