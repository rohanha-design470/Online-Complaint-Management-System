<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>ResolveIT Admin</b><span><a href="/">Submit</a> <a href="/track">Track</a></span></nav><main class="card wide"><h1>Complaint Dashboard</h1><p class="muted">Review submissions and change their status.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Email</th><th>Category</th><th>Subject</th><th>Status</th><th>Update</th><th></th></tr></thead><tbody><tr th:each="c:${complaints}"><td th:text="${c.id}"></td><td th:text="${c.fullName}"></td><td th:text="${c.email}"></td><td th:text="${c.category}"></td><td th:text="${c.subject}"></td><td th:text="${c.status}"></td><td><form class="inline" th:action="@{/admin/{id}/status(id=${c.id})}" method="post"><select name="status"><option th:selected="${c.status=='Submitted'}">Submitted</option><option th:selected="${c.status=='In Progress'}">In Progress</option><option th:selected="${c.status=='Resolved'}">Resolved</option><option th:selected="${c.status=='Rejected'}">Rejected</option></select><button class="small" type="submit">Save</button></form></td><td><form th:action="@{/admin/{id}/delete(id=${c.id})}" method="post"><button class="danger small" type="submit">Delete</button></form></td></tr></tbody></table></div><p th:if="${complaints.isEmpty()}">No complaints submitted yet.</p></main></body></html>
