<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Submit Complaint</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>ResolveIT</b><span><a href="/">Submit</a> <a href="/track">Track</a> <a href="/admin">Admin</a></span></nav><main class="card"><h1>Raise a Complaint</h1><p class="muted">Tell us what's wrong and we'll help you resolve it.</p><form th:action="@{/submit}" th:object="${complaint}" method="post"><label>Full name</label><input th:field="*{fullName}" placeholder="Your full name" required><label>Email</label><input type="email" th:field="*{email}" placeholder="name@example.com" required><label>Category</label><select th:field="*{category}" required><option value="">Choose category</option><option>Electricity</option><option>Water</option><option>Internet</option><option>Roads</option><option>Sanitation</option><option>Other</option></select><label>Subject</label><input th:field="*{subject}" placeholder="Short complaint title" required><label>Description</label><textarea th:field="*{description}" rows="5" placeholder="Describe the issue..." required></textarea><button type="submit">Submit Complaint</button></form></main></body></html>
